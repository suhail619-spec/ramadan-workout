<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ramadan Workout</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

<h1>Ramadan Workout Tracker</h1>

<div id="dashboard">
  <h2>Session Data</h2>
  <input type="number" id="weight" placeholder="Body weight (kg)">
  <input type="number" id="kneePain" placeholder="Knee pain (1-10)">
  <input type="number" id="calories" placeholder="Calories burned">
  <input type="number" id="duration" placeholder="Duration (minutes)">
  <button onclick="saveSession()">Save Session</button>
</div>

<hr>

<div id="workoutContainer"></div>

<script src="script.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>
</body>
</html>
